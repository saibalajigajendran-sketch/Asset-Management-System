name: Deploy Solution asset-management

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and Package SPFx Solution
        run: npm run build

      - name: Verify SPFx Package
        run: |
          if [ ! -f "sharepoint/solution/asset-management.sppkg" ]; then
            echo "SPFx package was not generated."
            exit 1
          fi
          echo "SPFx package generated successfully."

      - name: Login to Microsoft 365
        uses: pnp/action-cli-login@v4
        with:
          CERTIFICATE_ENCODED: ${{ secrets.CERTIFICATE_ENCODED }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          APP_ID: ${{ secrets.APP_ID }}
          TENANT: ${{ secrets.TENANT_ID }}

      - name: Deploy SPFx Solution
        uses: pnp/action-cli-deploy@v6
        with:
          APP_FILE_PATH: sharepoint/solution/asset-management.sppkg
          SKIP_FEATURE_DEPLOYMENT: true
          OVERWRITE: true